<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的培育計畫</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
  :root { --brand:#385a4c; --brand2:#6d9c7e; --ink:#2e3a33; --muted:#6c7a71; --line:#dfe3da; --soft:#e6ede7; --serif:"Noto Serif TC","Songti TC","PMingLiU",serif; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin:0; background:#ecece6; color:var(--ink); font:14px/1.7 "Noto Sans TC","Microsoft JhengHei",sans-serif; }
  .bar { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:12px; align-items:center; justify-content:space-between; }
  .bar button { font:inherit; font-weight:700; background:var(--brand); color:#fff; border:0; border-radius:10px; padding:8px 16px; cursor:pointer; }

  .page { width:210mm; min-height:297mm; margin:16px auto; background:#fff; padding:14mm; break-after:page; box-shadow:0 2px 12px #0002; }

  /* 頁首：小方塊標記 + 名稱 + 日期 */
  .mh { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:14px; letter-spacing:.04em; }
  .mh i { width:9px; height:9px; background:var(--brand); display:inline-block; }
  .mh i + i { background:var(--ink); margin-left:-4px; }
  .mh em { margin-left:auto; font-style:normal; }

  /* 內頁：左文右圖 */
  .cols { display:grid; grid-template-columns: 1fr 52mm; gap:8mm; align-items:start; }
  .cols.wide { grid-template-columns: 1fr; }
  aside .ph { display:block; width:100%; object-fit:cover; border-radius:10px; }
  aside .ph.a { height:64mm; }
  aside .ph.b { height:46mm; margin-top:6mm; }
  aside .cap { font-size:11px; color:var(--muted); margin:4px 2px 0; }

  h1.pt, h2, .cover h1 { font-family: var(--serif); }
  h1.pt { font-size:28px; line-height:1.25; font-weight:900; margin:0 0 4px; color:var(--ink); }
  .sub { color:var(--muted); font-size:12px; margin:0 0 8px; }
  h2 { font-size:17px; font-weight:700; color:var(--brand); margin:20px 0 8px; padding-bottom:4px; border-bottom:2px solid var(--brand); display:flex; align-items:center; gap:8px; }
  h2::before { content:""; width:8px; height:8px; background:var(--brand); }
  h2:first-of-type { margin-top:6px; }
  table { width:100%; border-collapse:collapse; margin:4px 0 8px; break-inside:auto; }
  tr { break-inside:avoid; }
  th, td { padding:6px 8px; vertical-align:top; text-align:left; font-size:13px; border-bottom:1px solid var(--line); }
  th { width:34%; color:var(--brand); font-weight:700; background:#f3f6f1; }
  .muted { color:var(--muted); }
  p { margin:6px 0; }

  /* 封面：照片滿版 */
  .cover { padding:0; width:210mm; height:297mm; min-height:297mm; position:relative; overflow:hidden; color:#fff; background:var(--brand) center / cover no-repeat; page: cover; }
  .cover .shade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(16,34,26,.62) 0%, rgba(16,34,26,.12) 34%, rgba(16,34,26,.05) 52%, rgba(16,34,26,.78) 100%); }
  .cover .in { position:absolute; inset:0; padding:16mm 15mm; display:flex; flex-direction:column; justify-content:space-between; }
  .cover .tag { font-size:12px; letter-spacing:.12em; display:flex; align-items:center; gap:8px; }
  .cover .tag i { width:10px; height:10px; background:#fff; display:inline-block; }
  .cover h1 { font-size:42px; line-height:1.2; font-weight:900; margin:12px 0 6px; text-shadow:0 2px 14px #0008; }
  .cover .who { font-size:15px; opacity:.95; text-shadow:0 1px 8px #000a; }
  .letter { background:rgba(255,255,255,.92); color:var(--ink); border-radius:14px; padding:16px 20px; font-size:17px; line-height:1.75; }
  .letter b { color:var(--brand); }

  @media print {
    body { background:#fff; } .bar { display:none; }
    .page { margin:0; box-shadow:none; width:auto; min-height:0; padding:0; }
    .cover { width:210mm; height:297mm; }
  }
  .q4i { display:flex; gap:4px; margin:0 0 4px; }
  .q4i svg { width:30px; height:36px; display:block; }
  .phbig img { display:block; width:100%; max-height:118mm; object-fit:cover; border-radius:10px; margin-bottom:8px; break-inside:avoid; }
  .phgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .phgrid img { width:100%; height:58mm; object-fit:cover; border-radius:10px; break-inside:avoid; }
  .dash .grid2 { display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .dash .card { border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:#fff; margin:6px 0; break-inside:avoid; }
  .dash .bar { height:9px; background:var(--line); border-radius:99px; overflow:hidden; }
  .dash .bar i { display:block; height:100%; background:var(--brand); }
  .dash .hint { color:var(--muted); font-size:12px; }
  .dash .row { display:flex; gap:8px; justify-content:space-between; }
  .dash .q { font-weight:700; }
  .dash { --accent:#b8643c; }
  @page { size:A4; margin:14mm; }
  @page cover { size:A4; margin:0; }
</style>
</head>
<body>
<div class="bar"><span id="who">載入中…</span><button onclick="window.print()">列印／存成 PDF</button></div>
<div id="doc"></div>
<script src="supabase.min.js"></script>
<script src="common.js?v=1027b"></script>
<script src="dash.js?v=1027b"></script>
<script>
(async () => {
  const pid = parseInt(new URLSearchParams(location.search).get("pid"), 10);
  const d = await loadAll();
  const me = d.people.find((p) => p.id === pid);
  const doc = document.getElementById("doc");
  if (!me) { doc.innerHTML = `<div class="page">找不到這位參與者。</div>`; return; }
  document.getElementById("who").textContent = `${me.name} 的培育計畫${new URLSearchParams(location.search).get("v") === "guest" ? "（重要嘉賓版）" : new URLSearchParams(location.search).get("v") === "team" ? "（培育小組版）" : ""}`;
  const N = new Map(d.notes.map((n) => [nkey(n.scope, n.scope_key, n.stage, n.field), n.value]));
  const nv = (...a) => N.get(nkey(...a)) || "";
  const f = d.future.find((x) => x.person_id === pid) || {};
  const invs = d.inv.filter((x) => x.person_id === pid).sort((a, b) => a.trainee_id - b.trainee_id);
  const u = me.unit, g3 = me.seat2;
  const row = (l, v) => `<tr><th>${l}</th><td>${nl2br(v) || '<span class="muted">（未填寫）</span>'}</td></tr>`;
  const roles = (d.regs.find((r) => r.person_id === pid)?.roles || me.roles).map(roleLabel).join("／");
  const names = pjmNamesOf(d.roster, me.name).join("、") || "新手 PJM";
  // 重要嘉賓的 PDF：不含個別培育小組的內容，改放全班儀表板
  const ver = new URLSearchParams(location.search).get("v");   // guest = 嘉賓版、team = 培育小組版；沒指定時依身分決定
  const isGuest = ver === "guest" ? true : ver === "team" ? false : (d.regs.find((r) => r.person_id === pid)?.roles || me.roles).includes("guest");
  const DATE = "20261104", EVENT = "PJM 教練團 經驗反思交流會";

  // 內頁配圖：從無臉圖庫隨機抽（依參與者固定排序，重新整理也一樣），整份 PDF 不重複，也不會與封面相同
  const cover = f.image_url || "";
  const pool = INTERIOR_IMAGES.filter((x) => x !== cover);
  let seed = pid * 9301 + 49297; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  let pi = 0; const photo = () => (pi < pool.length ? pool[pi++] : "");
  const aside = (n) => { const a = photo(); const b = n > 1 ? photo() : ""; return "<aside>" + (a ? `<img class="ph a" src="${esc(a)}" alt="">` : "") + (b ? `<img class="ph b" src="${esc(b)}" alt="">` : "") + "</aside>"; };
  const head = () => `<div class="mh"><i></i><i></i><span>${EVENT}</span><em>${DATE}</em></div>`;
  const pageOf = (body, n = 2) => `<div class="page">${head()}<div class="cols"><div class="main">${body}</div>${aside(n)}</div></div>`;

  // 封面：照片滿版
  let h = `<div class="page cover" style="${cover ? `background-image:url('${esc(cover)}')` : ""}"><div class="shade"></div><div class="in">
    <div class="tag"><i></i>${EVENT} ${DATE}</div>
    <div>
      <h1 style="font-size:${isGuest ? 44 : names.length > 22 ? 30 : names.length > 12 ? 36 : 44}px">${isGuest ? "重要嘉賓<br>回饋紀錄" : esc(names) + "<br>的成長計畫"}</h1><div class="who">${esc(me.name)} · ${esc(roles)}${u ? " · " + esc(u) : ""}</div>
    </div>
    ${isGuest && !f.fill1 && !f.fill2 && !f.fill3 ? "<div></div>" : ""}
    <div class="letter" ${isGuest && !f.fill1 && !f.fill2 && !f.fill3 ? 'style="display:none"' : ""}>${esc(futureLead(isGuest ? [] : pjmNamesOf(d.roster, me.name)))}，我就能<b>${esc(f.fill1 || "＿＿＿")}</b>；即使培育人才過程中會遇到種種挑戰，我仍願意<b>${esc(f.fill2 || "＿＿＿")}</b>，因為<b>${esc(f.fill3 || "＿＿＿")}</b>。</div>
  </div></div>`;

  // 共通頁：小組討論與個人筆記
  const common = [];
  if (g3) common.push("<h2>小組討論：資源有限也有機會嘗試的做法（" + teamName(g3) + "）</h2><table>" + row("我們的答案", nv("seat", g3, 5, "tryable")) + "</table>");
  const myNotes = nv("person", String(pid), 4, "notes");
  const guestNote = nv("person", String(pid), 9, "guest_note");
  if (guestNote) common.push("<h2>我的筆記：重要嘉賓的回饋</h2><p>" + nl2br(guestNote) + "</p>");
  if (myNotes) common.push("<h2>我的筆記：教練 KS 的分享</h2><p>" + nl2br(myNotes) + "</p>");
  if (common.length) h += pageOf(common.join(""), 1);

  // 每位新手 PJM 一頁：培育起點 → 培育共識 → 可行性檢查
  if (!isGuest) rosterRowsOf(d.roster, me.name).filter((x) => x.id > 0).forEach((rw) => {
    const id = String(rw.id), q = (x) => nv("row", id, 7, x), r = (x) => nv("row", id, 8, x), pj = rowPjm(rw);
    const inv = invs.find((i) => i.trainee_id === rw.id);
    let body = '<h1 class="pt">' + esc(pj) + " 的培育計畫</h1>" + '<p class="sub">' + esc(rw.unit) + "｜" + esc(rowPeople(rw).join("、")) + "</p>";
    if (inv) body += "<h2>我的培育起點盤點</h2><table>" + row("目前掌握的資訊", inv.has_obs ? "已有具體工作行為觀察" : inv.has_obs === false ? "尚待觀察驗證" : "") +
      (inv.has_obs ? row("優先能力", (inv.abilities || []).join("、")) + row("三個月後的期待", inv.expectation) : row("了解 PJM 的機會", inv.opportunities)) + "</table>";
    body += "<h2>培育共識</h2><table>" +
      row("① 三個月後能獨立做到", q("q1")) + row("② 優先關注的能力", q("q2").split("||").filter(Boolean).join("、")) + row("③ 目前的培育起點", q("q3")) +
      row("④ 真實情境與下一步", q("q4")) + q4Fields(rw).map((x) => '<tr><th><span class="q4i">' + x.roles.map((rk) => sprigSvg(ROLES[rk].plant)).join("") + "</span>" + esc(x.label) + "，要做</th><td>" + (nl2br(q(x.key)) || '<span class="muted">（未填寫）</span>') + "</td></tr>").join("") + row("⑤ 何時執行／如何知道進步", q("q5")) + "</table>" +
      "<h2>可行性檢查</h2><table>" + F_QUESTIONS.map((x) => { const v = nv(...fLoc(x, rw)); return row(esc(x.q), x.multi ? v.split("||").filter(Boolean).join("、") : v); }).join("") + row("補充", r("fnote")) + "</table>";
    // 加分挑戰：夥伴寫給新手的一句話、預想障礙
    const tid = String(rw.id), anyNote = (field) => { let v = ""; d.notes.forEach((n) => { if (n.scope === "row" && n.scope_key === tid && n.field === field && (n.value || "").trim()) v = n.value; }); return v; };
    const msgs = d.notes.filter((n) => n.scope === "row" && n.scope_key === tid && n.field.startsWith("msg_") && (n.value || "").trim());
    const uniqMsgs = [...new Map(msgs.map((n) => [n.field, n])).values()];
    if (uniqMsgs.length) body += "<h2>夥伴給 " + esc(pj) + " 的一句話</h2>" + uniqMsgs.map((n) => '<p style="margin:6px 0">「' + esc(n.value.trim()) + "」<span class=\"muted\">— " + esc((d.people.find((p) => p.id === +n.field.slice(4)) || {}).name || "夥伴") + "</span></p>").join("");
    // 練習給回饋（只放自己寫的）
    const fbs = [["fb1", "意圖闡述"], ["fb2", "給予回饋"], ["fb3", "尋求回饋"]].map(([f, t]) => [t, anyNote(f + "_" + pid)]).filter(([, v]) => (v || "").trim());
    if (fbs.length) body += "<h2>練習給 " + esc(pj) + " 的回饋</h2><table>" + fbs.map(([t, v]) => row(esc(t), v)).join("") + "</table>";
    const pre = anyNote("premortem");
    if (pre) body += "<h2>預想障礙</h2><p>" + nl2br(pre) + "</p>";
    h += pageOf(body, 2);
  });

  // 重要嘉賓：加上全班培育計畫儀表板
  if (isGuest) {
    const st = dashStats(d.roster, nv, false);
    h += '<div class="page">' + head() + '<h1 class="pt">全班培育計畫概況</h1><p class="sub">已送出 ' + st.sent + "／" + st.total + ' 組培育小組的培育計畫</p><div class="dash">' + dashHtml(st, false) + "</div></div>";
  }
  // 重要嘉賓：加上工作坊滿意度的整體結果（只含統計，不含任何人的原始答案）
  if (isGuest) {
    let sv = null; try { const r = await sb.rpc("pjm_survey_summary"); sv = r.data; } catch {}
    const labels = Object.fromEntries(SURVEY_Q.map((q) => [q.k, q.q]));
    let body = '<h1 class="pt">工作坊滿意度結果</h1><p class="sub">' + (sv && sv.n ? "共 " + sv.n + " 份匿名問卷" : "目前尚無問卷回覆") + "</p>";
    if (sv && sv.n) {
      body += '<div class="dash">' + ["overall", "useful", "pace", "confidence"].map((k) => {
        const r = sv.rating[k] || { avg: null, dist: [0, 0, 0, 0, 0] }, avg = r.avg == null ? 0 : +r.avg;
        return '<div class="card"><div class="row"><span class="q">' + esc(labels[k]) + '</span><b>' + (r.avg == null ? "—" : avg.toFixed(1)) + ' / 5</b></div><div class="bar"><i style="width:' + Math.round((avg / 5) * 100) + '%"></i></div><div class="hint" style="margin-top:4px">' +
          [5, 4, 3, 2, 1].map((s) => s + " 分 " + (r.dist[s - 1] || 0) + " 人").join("　") + "</div></div>";
      }).join("") + "</div>";
    }
    // 開放題：facilitator 整理並發布後才會出現
    const textBlock = (q, v) => (v ? "<h2>" + esc(q) + "</h2><p>" + nl2br(v) + "</p>" : "");
    body += textBlock("今天最有收穫的是什麼？", nv("all", "all", 12, "survey_gain")) + textBlock("有什麼建議，可以讓工作坊更好？", nv("all", "all", 12, "survey_improve"));
    h += '<div class="page">' + head() + body + "</div>";
  }
  const gf = nv("all", "all", 9, "guest_final");
  if (gf) h += pageOf("<h2>重要嘉賓的回饋</h2><p>" + nl2br(gf) + "</p>", 1);
  // 工作坊剪影：大合照＋有拍到自己這一組的照片
  let allPhotos = []; try { const r = await sb.from("pjm_photos").select("*").order("id"); allPhotos = r.data || []; } catch {}
  const myUnits = new Set([me.unit, ...rosterRowsOf(d.roster, me.name).map((r) => r.unit)].filter(Boolean));
  const isMineUnit = (x) => x.tags.some((t) => t.startsWith("unit:") && myUnits.has(t.slice(5)));
  const mine = allPhotos.filter((x) => x.tags.includes("all") || (me.seat2 && x.tags.includes(me.seat2)) || isMineUnit(x));
  const purl = (pth) => SUPABASE_URL + "/storage/v1/object/public/pjm-photos/" + pth;
  if (mine.length) {
    const big = mine.filter((x) => x.tags.includes("all")), grp = mine.filter((x) => !x.tags.includes("all") && me.seat2 && x.tags.includes(me.seat2)), uni = mine.filter((x) => !x.tags.includes("all") && !(me.seat2 && x.tags.includes(me.seat2)));
    h += '<div class="page">' + head() + '<h1 class="pt">工作坊剪影</h1><p class="sub">' + EVENT + " " + DATE + "</p>" +
      (big.length ? '<h2>大合照</h2><div class="phbig">' + big.map((x) => '<img src="' + esc(purl(x.path)) + '" alt="">').join("") + "</div>" : "") +
      (grp.length ? "<h2>" + teamName(me.seat2) + " 的照片</h2>" + '<div class="phgrid">' + grp.map((x) => '<img src="' + esc(purl(x.path)) + '" alt="">').join("") + "</div>" : "") +
      [...myUnits].map((u) => { const ps = uni.filter((x) => x.tags.includes("unit:" + u)); return ps.length ? "<h2>" + esc(u) + " 培育小組的照片</h2>" + '<div class="phgrid">' + ps.map((x) => '<img src="' + esc(purl(x.path)) + '" alt="">').join("") + "</div>" : ""; }).join("") + "</div>";
  }
  doc.innerHTML = h;
})();
</script>
</body>
</html>
